[workspace]
members = [
    "crates/blks-core",
    "crates/blks-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Meik"]
license = "GPL-3.0-or-later OR LGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
