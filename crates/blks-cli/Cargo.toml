[package]
name = "blks-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
description = "High-Performance 384-Bit Cryptographic Tree-Hash CLI Utility (GPLv3)"

[[bin]]
name = "blks"
path = "src/main.rs"

[dependencies]
blks-core = { path = "../blks-core" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
memmap2 = "0.9"
rayon = "1.10"
